<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Currency">
  <meta name="description" content="Convert currencies and view historical exchange rates">
  <link rel="manifest" href="manifest.json">
  <title>Currency Converter - Kasipovic</title>
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">

    <!-- ── Sidebar (Desktop) ── -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">$</div>
          <span class="logo-text">Currency</span>
        </div>
      </div>
      <div class="nav-items">
        <button class="nav-item active" data-tab="convert">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span>Convert</span>
        </button>
        <button class="nav-item" data-tab="history">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          <span>History</span>
        </button>
      </div>
    </nav>

    <!-- ── Main Content ── -->
    <main class="content">

      <!-- Convert Tab -->
      <div id="tab-convert" class="tab-content active">
        <div class="panel-header">
          <h1>Convert</h1>
          <p class="panel-subtitle">Live exchange rates · 170+ currencies</p>
        </div>

        <div class="converter-card">

          <!-- From row: [picker][amount input] -->
          <div class="currency-row">
            <div class="currency-picker-host" id="from-currency"></div>
            <input
              type="number"
              class="amount-input"
              id="amount-input"
              value="1"
              min="0"
              step="any"
              placeholder="Amount"
              aria-label="Amount to convert"
              inputmode="decimal"
            >
          </div>

          <!-- Swap button -->
          <div class="swap-row">
            <button class="swap-btn" id="swap-btn" aria-label="Swap currencies">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <polyline points="19 12 12 19 5 12"/>
              </svg>
            </button>
          </div>

          <!-- To row: [picker][result display] -->
          <div class="currency-row">
            <div class="currency-picker-host" id="to-currency"></div>
            <div class="result-display">
              <span class="result-value" id="result-value">—</span>
            </div>
          </div>

          <div class="rate-info" id="rate-info">Loading rates…</div>
          <div class="location-status" id="location-status" style="display:none"></div>
          <div class="convert-error" id="convert-error" style="display:none">
            Unable to fetch rate. Check your connection.
          </div>

        </div>
      </div>

      <!-- History Tab -->
      <div id="tab-history" class="tab-content">
        <div class="panel-header">
          <h1>Rate History</h1>
          <p class="panel-subtitle">Historical exchange rates over time</p>
        </div>

        <div class="history-controls">
          <div class="history-pair">
            <div class="currency-picker-host" id="history-from"></div>
            <span class="history-arrow">→</span>
            <div class="currency-picker-host" id="history-to"></div>
          </div>
          <div class="period-buttons">
            <button class="period-btn" data-period="7">1W</button>
            <button class="period-btn active" data-period="30">1M</button>
            <button class="period-btn" data-period="90">3M</button>
            <button class="period-btn" data-period="180">6M</button>
          </div>
        </div>

        <div class="history-loading" id="history-loading" style="display:none">
          <div class="loading-bar"></div>
          <span>Fetching historical rates…</span>
        </div>

        <div class="chart-container" id="chart-container" style="display:none">
          <div class="chart-header" id="chart-header"></div>
          <svg class="rate-chart" id="rate-chart" viewBox="0 0 600 200"
               preserveAspectRatio="none" aria-label="Rate history chart"></svg>
        </div>

        <div class="history-table-container" id="history-table-container" style="display:none">
          <table class="history-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Rate</th>
                <th>Change</th>
              </tr>
            </thead>
            <tbody id="history-tbody"></tbody>
          </table>
        </div>

        <div class="history-error" id="history-error" style="display:none">
          Unable to fetch historical data. Check your connection.
        </div>
      </div>

    </main>

    <!-- ── Bottom Navigation (Mobile) ── -->
    <nav class="bottom-nav">
      <button class="bottom-nav-item active" data-tab="convert">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <span>Convert</span>
      </button>
      <button class="bottom-nav-item" data-tab="history">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span>History</span>
      </button>
    </nav>

  </div>

  <script src="/shared/app.js"></script>
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
