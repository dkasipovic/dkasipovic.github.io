<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Speedometer - Kasipovic</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Outfit:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2a;
    --text: #e8e8f0;
    --text-dim: #6a6a80;
    --accent: #00e5a0;
    --accent-glow: rgba(0, 229, 160, 0.15);
    --warning: #ffaa00;
    --danger: #ff4466;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    height: 100vh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }

  /* === HEADING / COMPASS === */
  .compass-section {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 16px 8px;
    gap: 6px;
  }

  .compass-bearing {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .compass-bearing .dir {
    color: var(--accent);
    font-weight: 600;
  }

  .compass-ring {
    position: relative;
    width: 64px;
    height: 64px;
  }

  .compass-ring svg {
    width: 100%;
    height: 100%;
    transition: transform 0.3s ease-out;
  }

  .compass-ticks {
    position: absolute;
    inset: 0;
  }

  .compass-ticks svg {
    transition: none;
  }

  /* === SPEEDOMETER === */
  .speedo-section {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }

  .speedo-container {
    position: relative;
    width: min(80vw, 320px);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .speedo-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .speedo-arc-bg {
    fill: none;
    stroke: var(--border);
    stroke-width: 8;
    stroke-linecap: round;
  }

  .speedo-arc-fill {
    fill: none;
    stroke: url(#arcGradient);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s ease-out;
    filter: drop-shadow(0 0 6px var(--accent-glow));
  }

  .speedo-tick {
    stroke: var(--border);
    stroke-width: 1.5;
  }

  .speedo-tick.major {
    stroke: var(--text-dim);
    stroke-width: 2;
  }

  .speedo-label {
    fill: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-anchor: middle;
  }

  .speedo-readout {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .speed-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    letter-spacing: -2px;
  }

  .speed-unit {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .speed-max-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    opacity: 0.6;
  }

  /* === GRAPH === */
  .graph-section {
    flex: 0 0 auto;
    height: 28vh;
    min-height: 120px;
    max-height: 180px;
    padding: 0 0 8px 0;
    position: relative;
  }

  .graph-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px 4px;
  }

  .graph-title {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 400;
  }

  .graph-scale {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    opacity: 0.5;
  }

  .graph-canvas-wrap {
    position: relative;
    height: calc(100% - 24px);
    margin: 0 12px;
    border-left: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .graph-canvas-wrap canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* === COORDINATES === */
  .coords-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 6px 16px 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }

  .coords-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  .coords-copy {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .coords-copy:active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  .coords-copy.copied {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  /* === STATUS OVERLAY === */
  .status-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 100;
    transition: opacity 0.4s;
  }

  .status-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .status-icon {
    width: 48px;
    height: 48px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.95); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  .status-text {
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.5;
  }

  .status-error {
    color: var(--danger);
  }
</style>
</head>
<body>

<div class="app">
  <!-- Compass -->
  <div class="compass-section">
    <div class="compass-bearing" id="bearingText"><span class="dir">--</span> ---°</div>
    <div class="compass-ring">
      <svg viewBox="0 0 64 64" id="compassSvg">
        <circle cx="32" cy="32" r="28" fill="none" stroke="#1e1e2a" stroke-width="1.5"/>
        <!-- Cardinal ticks -->
        <line x1="32" y1="5" x2="32" y2="10" stroke="#6a6a80" stroke-width="1.5"/>
        <line x1="32" y1="54" x2="32" y2="59" stroke="#2a2a3a" stroke-width="1"/>
        <line x1="5" y1="32" x2="10" y2="32" stroke="#2a2a3a" stroke-width="1"/>
        <line x1="54" y1="32" x2="59" y2="32" stroke="#2a2a3a" stroke-width="1"/>
        <!-- Arrow -->
        <polygon points="32,8 28,26 32,23 36,26" fill="#00e5a0" opacity="0.9"/>
        <polygon points="32,56 28,38 32,41 36,38" fill="#3a3a4a" opacity="0.5"/>
      </svg>
    </div>
  </div>

  <!-- Speedometer -->
  <div class="speedo-section">
    <div class="speedo-container">
      <svg class="speedo-svg" viewBox="0 0 300 300" id="speedoSvg">
        <defs>
          <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00e5a0"/>
            <stop offset="60%" stop-color="#00c8ff"/>
            <stop offset="100%" stop-color="#ff4466"/>
          </linearGradient>
        </defs>
        <!-- Ticks and labels rendered by JS -->
        <g id="speedoTicks"></g>
        <!-- Background arc -->
        <path id="speedoArcBg" class="speedo-arc-bg" d=""/>
        <!-- Fill arc -->
        <path id="speedoArcFill" class="speedo-arc-fill" d=""/>
      </svg>
      <div class="speedo-readout">
        <div class="speed-value" id="speedValue">0.0</div>
        <div class="speed-unit">km/h</div>
      </div>
    </div>
    <div class="speed-max-label" id="maxSpeedLabel">max 0.0 km/h</div>
  </div>

  <!-- Graph -->
  <div class="graph-section">
    <div class="graph-header">
      <span class="graph-title">Speed History</span>
      <span class="graph-scale" id="graphScale">0–10 km/h</span>
    </div>
    <div class="graph-canvas-wrap">
      <canvas id="graphCanvas"></canvas>
    </div>
  </div>

  <!-- Coordinates -->
  <div class="coords-bar">
    <span class="coords-text" id="coordsText">Waiting for GPS…</span>
    <button class="coords-copy" id="coordsCopy" onclick="copyCoords()">Copy</button>
  </div>
</div>

<!-- Status overlay -->
<div class="status-overlay" id="statusOverlay">
  <div class="status-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00e5a0" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 2v2m0 16v2M2 12h2m16 0h2m-3.3-6.7-1.4 1.4M6.7 17.3l-1.4 1.4m0-13.4 1.4 1.4m10.6 10.6 1.4 1.4"/>
    </svg>
  </div>
  <div class="status-text" id="statusText">Acquiring GPS signal…</div>
</div>

<script>
// ============ STATE ============
const state = {
  speed: 0,           // km/h
  heading: null,
  lat: null,
  lng: null,
  accuracy: null,
  maxSpeed: 0,
  scaleMax: 10,       // current gauge max
  history: [],        // {t, speed}
  gpsActive: false,
  watchId: null,
  wakeLock: null,
  noSleepVideo: null
};

const SCALE_THRESHOLDS = [10, 50, 100, 200, 400, 800, 1600];

// ============ DOM ============
const $speedValue = document.getElementById('speedValue');
const $maxSpeedLabel = document.getElementById('maxSpeedLabel');
const $bearingText = document.getElementById('bearingText');
const $compassSvg = document.getElementById('compassSvg');
const $speedoArcBg = document.getElementById('speedoArcBg');
const $speedoArcFill = document.getElementById('speedoArcFill');
const $speedoTicks = document.getElementById('speedoTicks');
const $graphCanvas = document.getElementById('graphCanvas');
const $graphScale = document.getElementById('graphScale');
const $coordsText = document.getElementById('coordsText');
const $coordsCopy = document.getElementById('coordsCopy');
const $statusOverlay = document.getElementById('statusOverlay');
const $statusText = document.getElementById('statusText');

// ============ SPEEDO ARC GEOMETRY ============
const ARC_CX = 150, ARC_CY = 150, ARC_R = 130;
const ARC_START = 135;  // degrees (bottom-left)
const ARC_END = 405;    // degrees (bottom-right, i.e. 45 past full circle)
const ARC_SPAN = ARC_END - ARC_START; // 270 degrees

function polarToCart(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function describeArc(cx, cy, r, startAngle, endAngle) {
  const s = polarToCart(cx, cy, r, startAngle);
  const e = polarToCart(cx, cy, r, endAngle);
  const sweep = endAngle - startAngle;
  const largeArc = sweep > 180 ? 1 : 0;
  return `M ${s.x} ${s.y} A ${r} ${r} 0 ${largeArc} 1 ${e.x} ${e.y}`;
}

function buildSpeedoArc() {
  const d = describeArc(ARC_CX, ARC_CY, ARC_R, ARC_START, ARC_END);
  $speedoArcBg.setAttribute('d', d);
  $speedoArcFill.setAttribute('d', d);

  // Calc total arc length for stroke-dasharray
  const totalLen = (ARC_SPAN / 360) * 2 * Math.PI * ARC_R;
  $speedoArcFill.style.strokeDasharray = totalLen;
  $speedoArcFill.style.strokeDashoffset = totalLen;
  $speedoArcFill.dataset.totalLen = totalLen;
}

function buildTicks() {
  $speedoTicks.innerHTML = '';
  const max = state.scaleMax;
  // Decide tick interval
  let majorInterval, minorInterval;
  if (max <= 10) { majorInterval = 2; minorInterval = 1; }
  else if (max <= 50) { majorInterval = 10; minorInterval = 5; }
  else if (max <= 100) { majorInterval = 20; minorInterval = 10; }
  else if (max <= 200) { majorInterval = 50; minorInterval = 25; }
  else { majorInterval = 100; minorInterval = 50; }

  for (let v = 0; v <= max; v += minorInterval) {
    const frac = v / max;
    const angle = ARC_START + frac * ARC_SPAN;
    const isMajor = v % majorInterval === 0;

    const outerR = ARC_R + 12;
    const innerR = isMajor ? ARC_R + 2 : ARC_R + 5;
    const p1 = polarToCart(ARC_CX, ARC_CY, innerR, angle);
    const p2 = polarToCart(ARC_CX, ARC_CY, outerR, angle);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', p1.x);
    line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x);
    line.setAttribute('y2', p2.y);
    line.setAttribute('class', isMajor ? 'speedo-tick major' : 'speedo-tick');
    $speedoTicks.appendChild(line);

    if (isMajor) {
      const lp = polarToCart(ARC_CX, ARC_CY, outerR + 12, angle);
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', lp.x);
      text.setAttribute('y', lp.y);
      text.setAttribute('class', 'speedo-label');
      text.setAttribute('dominant-baseline', 'central');
      text.textContent = v;
      $speedoTicks.appendChild(text);
    }
  }
}

function updateSpeedoArc(speed) {
  const frac = Math.min(speed / state.scaleMax, 1);
  const totalLen = parseFloat($speedoArcFill.dataset.totalLen);
  $speedoArcFill.style.strokeDashoffset = totalLen * (1 - frac);
}

// ============ COMPASS ============
function getCardinal(deg) {
  if (deg == null) return '--';
  const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  return dirs[Math.round(deg / 45) % 8];
}

function updateCompass(heading) {
  if (heading == null) {
    $bearingText.innerHTML = '<span class="dir">--</span> ---°';
    $compassSvg.style.transform = 'rotate(0deg)';
    return;
  }
  const cardinal = getCardinal(heading);
  $bearingText.innerHTML = `<span class="dir">${cardinal}</span> ${Math.round(heading)}°`;
  $compassSvg.style.transform = `rotate(${-heading}deg)`;
}

// ============ SCALE ============
function checkScale(speed) {
  // Use the max speed visible in the graph (same window as drawGraph) so the
  // scale never drops below what is needed to display historical data on screen.
  const pointSpacing = 3;
  const graphWidth = $graphCanvas.parentElement
    ? $graphCanvas.parentElement.getBoundingClientRect().width
    : 0;
  const maxPoints = graphWidth > 0 ? Math.floor(graphWidth / pointSpacing) : state.history.length;
  const visible = state.history.slice(-maxPoints);
  const maxInHistory = visible.reduce((m, p) => Math.max(m, p.speed), speed);

  for (const t of SCALE_THRESHOLDS) {
    if (t >= maxInHistory) {
      if (t !== state.scaleMax) {
        state.scaleMax = t;
        buildTicks();
        buildSpeedoArc();
        $graphScale.textContent = `0–${t} km/h`;
      }
      return;
    }
  }
  // Beyond all thresholds
  const next = Math.ceil(maxInHistory / 100) * 100;
  if (next !== state.scaleMax) {
    state.scaleMax = next;
    buildTicks();
    buildSpeedoArc();
    $graphScale.textContent = `0–${next} km/h`;
  }
}

// ============ GRAPH ============
let graphCtx;
function initGraph() {
  const dpr = window.devicePixelRatio || 1;
  const rect = $graphCanvas.parentElement.getBoundingClientRect();
  $graphCanvas.width = rect.width * dpr;
  $graphCanvas.height = rect.height * dpr;
  graphCtx = $graphCanvas.getContext('2d');
  graphCtx.scale(dpr, dpr);
}

function drawGraph() {
  if (!graphCtx) return;
  const rect = $graphCanvas.parentElement.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  const ctx = graphCtx;

  ctx.clearRect(0, 0, w, h);

  const data = state.history;
  if (data.length < 2) return;

  const max = state.scaleMax;
  const pointSpacing = 3; // pixels between points
  const maxPoints = Math.floor(w / pointSpacing);

  // Slice to what fits
  const visible = data.slice(-maxPoints);

  // Draw grid lines
  ctx.strokeStyle = 'rgba(30,30,42,0.8)';
  ctx.lineWidth = 0.5;
  for (let i = 1; i < 4; i++) {
    const y = h - (i / 4) * h;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }

  // Draw fill
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(0,229,160,0.25)');
  grad.addColorStop(1, 'rgba(0,229,160,0.0)');

  ctx.beginPath();
  const startX = w - (visible.length - 1) * pointSpacing;
  ctx.moveTo(startX, h);

  for (let i = 0; i < visible.length; i++) {
    const x = startX + i * pointSpacing;
    const y = h - (visible[i].speed / max) * h;
    if (i === 0) ctx.lineTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.lineTo(startX + (visible.length - 1) * pointSpacing, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Draw line
  ctx.beginPath();
  for (let i = 0; i < visible.length; i++) {
    const x = startX + i * pointSpacing;
    const y = h - (visible[i].speed / max) * h;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#00e5a0';
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Current speed dot
  if (visible.length > 0) {
    const last = visible[visible.length - 1];
    const lx = startX + (visible.length - 1) * pointSpacing;
    const ly = h - (last.speed / max) * h;
    ctx.beginPath();
    ctx.arc(lx, ly, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#00e5a0';
    ctx.fill();
    // Glow
    ctx.beginPath();
    ctx.arc(lx, ly, 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,229,160,0.3)';
    ctx.fill();
  }
}

// ============ GPS ============
function startGPS() {
  if (!navigator.geolocation) {
    $statusText.classList.add('status-error');
    $statusText.textContent = 'Geolocation not supported by this browser.';
    return;
  }

  $statusText.textContent = 'Acquiring GPS signal…';

  state.watchId = navigator.geolocation.watchPosition(
    (pos) => {
      if (!state.gpsActive) {
        state.gpsActive = true;
        $statusOverlay.classList.add('hidden');
      }

      const coords = pos.coords;
      // Speed: m/s → km/h, null if unavailable
      let speed = coords.speed != null ? coords.speed * 3.6 : 0;
      if (speed < 0) speed = 0;

      state.speed = speed;
      state.heading = coords.heading;
      state.lat = coords.latitude;
      state.lng = coords.longitude;
      state.accuracy = coords.accuracy;

      if (speed > state.maxSpeed) state.maxSpeed = speed;

      // Check scale
      checkScale(speed);

      // Record history
      state.history.push({ t: Date.now(), speed });
      // Cap history to prevent memory issues (keep last 5000 points)
      if (state.history.length > 5000) state.history.shift();

      // Update UI
      updateUI();
    },
    (err) => {
      console.error('GPS error:', err);
      if (!state.gpsActive) {
        $statusText.classList.add('status-error');
        if (err.code === 1) {
          $statusText.textContent = 'Location access denied.\nPlease enable GPS permissions.';
        } else if (err.code === 2) {
          $statusText.textContent = 'GPS signal unavailable.\nTry moving outdoors.';
        } else {
          $statusText.textContent = 'GPS timeout.\nTrying again…';
        }
      }
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000
    }
  );
}

function updateUI() {
  // Speed display
  $speedValue.textContent = state.speed.toFixed(1);

  // Max speed
  $maxSpeedLabel.textContent = `max ${state.maxSpeed.toFixed(1)} km/h`;

  // Arc
  updateSpeedoArc(state.speed);

  // Compass
  updateCompass(state.heading);

  // Coords
  if (state.lat != null) {
    const latStr = state.lat.toFixed(6);
    const lngStr = state.lng.toFixed(6);
    const accStr = state.accuracy != null ? ` ±${Math.round(state.accuracy)}m` : '';
    $coordsText.textContent = `${latStr}, ${lngStr}${accStr}`;
  }

  // Graph
  drawGraph();
}

// ============ COPY COORDS ============
function copyCoords() {
  if (state.lat == null) return;
  const text = `${state.lat.toFixed(6)}, ${state.lng.toFixed(6)}`;
  navigator.clipboard.writeText(text).then(() => {
    $coordsCopy.classList.add('copied');
    $coordsCopy.textContent = 'Copied';
    setTimeout(() => {
      $coordsCopy.classList.remove('copied');
      $coordsCopy.textContent = 'Copy';
    }, 1500);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    $coordsCopy.classList.add('copied');
    $coordsCopy.textContent = 'Copied';
    setTimeout(() => {
      $coordsCopy.classList.remove('copied');
      $coordsCopy.textContent = 'Copy';
    }, 1500);
  });
}

function enableNoSleepVideo() {
  if (state.noSleepVideo) return;
  const video = document.createElement('video');

  video.setAttribute('webkit-playsinline', '');
  video.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:-1';
  document.body.appendChild(video);
  state.noSleepVideo = video;

  // Start muted (allowed without gesture), then unmute on first touch for full iOS wake
  video.muted = true;
  video.play().catch(() => {});

  if (isIOS) {
    const unmute = () => {
      video.muted = false;
      video.volume = 0.01;       // near-silent but creates active audio session
      video.play().catch(() => {});
      document.removeEventListener('touchstart', unmute);
    };
    document.addEventListener('touchstart', unmute, { once: true });
  }

  // Re-start if the video ends or the tab becomes visible again
  video.addEventListener('ended', () => { video.play().catch(() => {}); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.noSleepVideo) {
      state.noSleepVideo.play().catch(() => {});
    }
  });
  try {
    const video = document.createElement('video');
    video.setAttribute('playsinline', '');
    video.setAttribute('muted', '');
    video.muted = true;
    video.loop = true;
    video.src = NOSLEEP_MP4;
    video.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:-1';

  } catch (e) {

function disableNoSleepVideo() {
  if (state.noSleepVideo) {
    state.noSleepVideo.pause();
    state.noSleepVideo.remove();
    state.noSleepVideo = null;
  }
}

function init() {
  buildTicks();
  buildSpeedoArc();
  initGraph();
  startGPS();

  // Handle resize
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      initGraph();
      drawGraph();
    }, 150);
  });

  // Safari requires a user gesture to grant wake lock.
  // Acquire it on the first user interaction (tap/click).
  let wakeLockActivated = false;
  function activateWakeLockOnGesture() {
    if (wakeLockActivated) return;
    wakeLockActivated = true;
    // If we already hold the video fallback, release it and try the real API
    // now that we have a user gesture.
    disableNoSleepVideo();
    requestWakeLock();
  }
  document.addEventListener('click', activateWakeLockOnGesture, { once: false });
  document.addEventListener('touchend', activateWakeLockOnGesture, { once: false });

  // Also attempt on load (works on Chrome/Firefox, silently fails on Safari).
  requestWakeLock();

  // Re-acquire wake lock when returning to the page.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !state.wakeLock) {
      // Small delay: Safari may fire this event before the document is fully
      // considered "visible", causing a NotAllowedError.
      setTimeout(() => requestWakeLock(), 100);
    }
  });
}
