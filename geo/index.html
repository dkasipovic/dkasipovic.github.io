<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Гео">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <title>Гео - Kasipovic</title>
    <link rel="stylesheet" href="/shared/styles.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">
        <header class="panel panel-country">
            <div class="panel-label">Држава</div>
            <div class="panel-value" id="countryName">Додирни државу на карти</div>
        </header>

        <main class="panel-map">
            <div class="map-toolbar">
                <button class="btn-random" id="randomBtn">🎲 Насумично</button>
                <button class="btn-settings" id="settingsBtn" aria-label="Подешавања">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
            <div class="map-host" id="mapHost"></div>
            <button class="btn-reset-view" id="resetViewBtn" hidden aria-label="Цела карта" title="Цела карта">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                    <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
                    <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
                    <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
                </svg>
            </button>
        </main>

        <footer class="panel panel-capital">
            <div class="panel-label">Главни град</div>
            <div class="panel-value" id="capitalName">—</div>
            <button class="capital-cover" id="capitalCover" hidden>
                <span class="cover-icon">👆</span>
                <span>Додирни да откријеш</span>
            </button>
        </footer>
    </div>

    <div class="settings-overlay" id="settingsOverlay" hidden>
        <div class="settings-card">
            <div class="settings-title">
                <span>Подешавања</span>
                <button class="btn-close" id="settingsClose" aria-label="Затвори">✕</button>
            </div>
            <div class="setting-group">
                <div class="setting-group-label">Континент</div>
                <div class="continent-grid" id="continentGrid"></div>
            </div>
            <div class="setting-group">
                <div class="setting-group-label">Режим</div>
                <div class="mode-toggle" id="modeToggle">
                    <button data-mode="learn">📖 Учење</button>
                    <button data-mode="game">🎮 Игра</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/shared/app.js"></script>
    <script src="script.js"></script>
</body>

</html>
