<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Вук">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <title>Вук - Kasipovic</title>
    <link rel="stylesheet" href="/shared/styles.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="main-layout">
            <div class="score-bar" id="scoreBar">
                <span class="score-stat"><span class="score-icon score-icon-correct">✓</span> <span id="scoreCorrect">0</span>/<span id="scoreTotal">0</span></span>
                <span class="score-stat"><span class="score-icon">⏱</span> <span id="scoreAvg">0.0</span>s</span>
            </div>

            <div class="sentence-card" id="sentenceCard">
                <div class="sentence-text" id="sentenceText"></div>
                <div class="sentence-hint" id="sentenceHint">додирни за нову реченицу</div>
            </div>

            <div class="score-buttons" id="scoreButtons">
                <button class="btn-score btn-correct" id="btnCorrect" title="Тачно">✓</button>
                <button class="btn-score btn-wrong" id="btnWrong" title="Нетачно">✗</button>
            </div>

            <div class="controls">
                <button class="btn-generate" id="generateBtn">Генериши</button>
                <button class="btn-settings" id="settingsBtn" title="Подешавања">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>

            <div class="settings-panel" id="settingsPanel">
                <div class="setting-row">
                    <label class="setting-label">
                        <span>Најмање речи</span>
                        <span class="setting-value" id="minValue">5</span>
                    </label>
                    <input type="range" class="setting-range" id="minWords" min="2" max="10" value="5">
                </div>
                <div class="setting-row">
                    <label class="setting-label">
                        <span>Највише речи</span>
                        <span class="setting-value" id="maxValue">7</span>
                    </label>
                    <input type="range" class="setting-range" id="maxWords" min="2" max="12" value="7">
                </div>
                <div class="setting-row">
                    <label class="setting-label">
                        <span>Праћење резултата</span>
                        <button class="toggle-btn" id="trackScoreToggle" type="button" role="switch" aria-checked="false">
                            <span class="toggle-knob"></span>
                        </button>
                    </label>
                </div>
                <div class="setting-row">
                    <button class="btn-reset" id="resetBtn" type="button">Ресетуј све</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/shared/app.js"></script>
    <script src="script.js"></script>
</body>

</html>
